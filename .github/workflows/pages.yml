name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    # FE-27: fast checks (no browser) gate every deploy; the browser tests stay in tools/test/all.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast checks
        env:
          SW_BASE: ${{ github.event.before }}
        run: bash tools/test/fast.sh
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copy media into the site
        run: rm -rf app/media && cp -r media app/media
      - name: Account config (Q11, docs/SUPABASE.md) — only when the repo Variables are set
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          URL="${URL%/}"
          if [[ "$URL" =~ ^https://[a-z0-9-]+\.supabase\.co$ && -n "$KEY" ]]; then
            jq -n --arg url "$URL" --arg key "$KEY" '{url:$url,key:$key}' > app/supabase-config.json
            sed -i "s#connect-src 'self'#connect-src 'self' $URL#" app/index.html
            grep -q "connect-src 'self' $URL" app/index.html && echo "account config written for $URL"
          else
            echo "no Supabase Variables: Sign in with Google stays hidden"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
